[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se inyecta en env.py desde app.core.config (lee .env),
# asi que esta linea es solo un valor de respaldo/documentacion.
sqlalchemy.url = postgresql+psycopg://aerotiquetes:aerotiquetes@localhost:5432/aerotiquetes

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
